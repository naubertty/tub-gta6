<style>
:root{--c1:#ff3d8b;--c2:#ffb347;--g1:#2b0a4a;--g2:#ff3d8b;--g3:#ff9a3c;--txt:#fff;--page:#000;
  --f1:'Bungee',Impact,'Arial Black',sans-serif;--f2:'Rajdhani','Arial Narrow',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--page);touch-action:manipulation;font-family:var(--f2);color:var(--txt)}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* ===== Palco 1080x1920 (escala para caber na tela) ===== */
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center;overflow:hidden;
  background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%)}
#sun{position:absolute;left:50%;bottom:120px;width:900px;height:900px;margin-left:-450px;border-radius:50%;
  background:linear-gradient(180deg,var(--c2),var(--c1));opacity:.35;filter:blur(2px)}
.palm{position:absolute;bottom:90px;font-size:420px;filter:brightness(0) opacity(.55);line-height:1}
#palmL{left:-60px}#palmR{right:-60px;transform:scaleX(-1)}
#head{position:absolute;top:70px;left:0;right:0;text-align:center}
#badge{display:inline-block;background:#e5173f;padding:8px 34px;border-radius:12px;font:700 40px var(--f2);letter-spacing:6px;animation:blink 1.2s infinite}
#title{font:84px/1.05 var(--f1);margin-top:26px;text-shadow:0 0 30px var(--c1),0 6px 0 rgba(0,0,0,.35)}
#sub{font:700 46px var(--f2);color:var(--c2);margin-top:12px;letter-spacing:3px}
@keyframes blink{50%{opacity:.45}}

#stage.photo #sun,#stage.photo .palm,#stage.photo2 #sun,#stage.photo2 .palm{display:none!important}
/* Player */
#playerBox{position:absolute;left:50%;transform:translateX(-50%);border-radius:28px;overflow:hidden;background:#000;
  border:4px solid var(--c1);box-shadow:0 0 60px var(--c1),0 0 120px rgba(0,0,0,.5)}
#playerBox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;font:700 38px var(--f2);color:#ddd}
/* Widgets */
#widgets{position:absolute;top:1190px;left:40px;right:40px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.w{background:rgba(0,0,0,.45);border:2px solid var(--c1);border-radius:22px;padding:22px 26px;backdrop-filter:blur(6px)}
.w h3{font:26px var(--f1);color:var(--c2);margin-bottom:10px}
.big{font:700 64px var(--f2)}
.full{grid-column:1/-1}
.bar{height:34px;background:rgba(255,255,255,.18);border-radius:17px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));width:0;transition:width .4s}
#rulesT{font:700 34px/1.35 var(--f2);white-space:pre-line}
#foot{position:absolute;left:0;right:0;bottom:130px;text-align:center;font:700 44px var(--f2);letter-spacing:2px;text-shadow:0 3px 10px #000}
#foot b{color:var(--c2)}
#ticker{position:absolute;left:0;right:0;bottom:0;height:100px;background:rgba(0,0,0,.6);border-top:4px solid var(--c1);overflow:hidden;display:flex;align-items:center}
#tk{white-space:nowrap;font:700 44px var(--f2);animation:mq 25s linear infinite;padding-left:100%}
@keyframes mq{to{transform:translateX(-100%)}}
/* ===== Controles (fora do palco) ===== */
#gear{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;width:52px;height:52px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:26px}
#exit{position:fixed;left:0;top:0;width:90px;height:90px;z-index:30;background:transparent;border:0}
#panel{position:fixed;inset:0 0 0 auto;width:min(380px,100%);z-index:25;background:#16121f;color:#eee;overflow-y:auto;padding:16px 16px 40px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(100%);transition:transform .25s;font:15px var(--f2)}
#panel.open{transform:none}
#panel h2{font:20px var(--f1);margin-bottom:10px;color:var(--c2)}
#panel h4{margin:16px 0 6px;color:var(--c1);font-size:16px;text-transform:uppercase;letter-spacing:1px}
#panel label{display:block;margin:8px 0 3px;font-size:14px;color:#bbb}
#panel input[type=text],#panel input[type=number],#panel select,#panel textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#0d0a14;color:#fff;font-size:16px}
#panel input[type=range]{width:100%}
#panel input[type=color]{width:100%;height:40px;border:0;background:none}
.row{display:flex;gap:8px}.row>*{flex:1}
.chk{display:flex!important;align-items:center;gap:10px;color:#eee!important;font-size:15px!important}
.chk input{width:22px;height:22px}
.btn{padding:12px;border:0;border-radius:10px;background:var(--c1);color:#fff;font:700 15px var(--f2);margin-top:8px;width:100%}
.btn.alt{background:#3a3350}
#msg{font-size:13px;color:#ffcf6b;margin-top:6px}
body.rec #gear,body.rec #panel{display:none}
body:not(.rec) #exit{display:none}
#info{font:700 34px var(--f2);margin:10px 60px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px #000}
.big{font-size:52px}.w{padding:16px 22px}.w h3{font-size:22px;margin-bottom:6px}#widgets{top:1150px;gap:18px}
</style>
</head>
<body>
<div id="stage">
  <div id="sun"></div>
  <div class="palm" id="palmL">🌴</div><div class="palm" id="palmR">🌴</div>
  <div id="head">
    <span id="badge">● AO VIVO</span>
    <div id="title"></div>
    <div id="sub"></div>
    <div id="info"></div>
  </div>
  <div id="playerBox"><div id="ph">Abra o painel ⚙ e cole o link da sua live.</div></div>
  <div id="widgets">
    <div class="w" id="wClock"><h3>HORA</h3><div class="big" id="clk">--:--</div></div>
    <div class="w" id="wTimer"><h3>TEMPO DE LIVE</h3><div class="big" id="tmr">00:00:00</div></div>
    <div class="w full" id="wGoal"><h3 id="goalL">META DO DIA</h3><div class="big" id="goalN">0/100</div><div class="bar"><i id="goalB"></i></div></div>
    <div class="w full" id="wRules"><h3>COMANDOS</h3><div id="rulesT"></div></div>
  </div>
  <div id="foot"></div>
  <div id="ticker"><div id="tk"></div></div>
</div>

<button id="gear" aria-label="Configurações">⚙</button>
<button id="exit" aria-label="Sair do modo gravação"></button>

<div id="panel">
  <h2>Personalizar</h2>
  <h4>Live da Twitch</h4>
  <label>Link ou nome do canal</label>
  <input type="text" id="chIn" placeholder="https://twitch.tv/meucanal" autocapitalize="off" autocorrect="off">
  <button class="btn" id="load">Carregar live</button>
  <div id="msg"></div>

  <h4>Textos</h4>
  <label>Título</label><input type="text" data-k="title">
  <label>Subtítulo / streamer</label><input type="text" data-k="sub">
  <label>@ do TikTok</label><input type="text" data-k="tiktok">
  <label>Nome do canal (rodapé)</label><input type="text" data-k="twitchName">
  <label>Texto rolante (separe com |)</label><textarea rows="3" data-k="ticker"></textarea>
  <label>Comandos / regras do chat</label><textarea rows="3" data-k="rules"></textarea>

  <h4>Visual</h4>
  <label>Tema</label>
  <select id="theme"><option value="vice">Vice Sunset</option><option value="neon">Neon Night</option><option value="dark">Dark Minimal</option><option value="miami">Miami Blue</option></select>
  <div class="row"><div><label>Cor 1</label><input type="color" data-k="c1"></div><div><label>Cor 2</label><input type="color" data-k="c2"></div></div>
  <label>Fundo</label><select data-k="bg"><option value="gta">Arte GTA 6</option><option value="sunset">Pôr do sol</option><option value="none">Só degradê do tema</option></select>
  <label>Tamanho do player</label><input type="range" min="600" max="1080" step="10" data-k="psize">
  <label>Posição vertical do player</label><input type="range" min="260" max="900" step="10" data-k="py">

  <h4>Meta do dia</h4>
  <label>Nome da meta</label><input type="text" data-k="goalLabel">
  <div class="row"><div><label>Atual</label><input type="number" data-k="goalCur"></div><div><label>Objetivo</label><input type="number" data-k="goalMax"></div></div>

  <h4>Elementos</h4>
  <label class="chk"><input type="checkbox" data-k="showTitle">Título e subtítulo</label>
  <label class="chk"><input type="checkbox" data-k="showBadge">Badge AO VIVO</label>
  <label class="chk"><input type="checkbox" data-k="showClock">Relógio</label>
  <label class="chk"><input type="checkbox" data-k="showTimer">Tempo de live</label>
  <label class="chk"><input type="checkbox" data-k="showGoal">Meta do dia</label>
  <label class="chk"><input type="checkbox" data-k="showRules">Comandos</label>
  <label class="chk"><input type="checkbox" data-k="showFoot">Rodapé (@ e canal)</label>
  <label class="chk"><input type="checkbox" data-k="showTicker">Texto rolante</label>
  <label class="chk"><input type="checkbox" data-k="showDeco">Palmeiras e sol</label>

  <button class="btn" id="rec">▶ Modo gravação</button>
  <button class="btn alt" id="rstT">Zerar tempo de live</button>

  <h4>Backup</h4>
  <textarea rows="3" id="bk" placeholder="Configurações em JSON"></textarea>
  <div class="row"><button class="btn alt" id="exp">Exportar</button><button class="btn alt" id="imp">Importar</button></div>
  <button class="btn alt" id="reset">Restaurar padrão</button>
</div>

<script>
// ===== Temas prontos =====
const THEMES={
  vice:{g1:'#2b0a4a',g2:'#ff3d8b',g3:'#ff9a3c',c1:'#ff3d8b',c2:'#ffb347'},
  neon:{g1:'#05010f',g2:'#1a0b3d',g3:'#3b0f6b',c1:'#00f0ff',c2:'#ff2bd6'},
  dark:{g1:'#0b0b0d',g2:'#141418',g3:'#202028',c1:'#e5e5e5',c2:'#9a9aa5'},
  miami:{g1:'#021b3a',g2:'#0a6bd6',g3:'#3de0d0',c1:'#3de0d0',c2:'#ff7ab8'}
};
// ===== Configurações padrão =====
const DEF={theme:'vice',c1:'#ff3d8b',c2:'#ffb347',title:'AO VIVO • GTA 6',sub:'Seu nome aqui',tiktok:'@seutiktok',twitchName:'seucanal',
  ticker:'Segue o canal!|Deixa o like!|Compartilha com os amigos!|Bem-vindo à live!',rules:'!discord  •  !pix  •  !setup',
  psize:1040,py:520,goalLabel:'META DO DIA',goalCur:0,goalMax:100,channel:'',
  showTitle:true,showBadge:true,showClock:true,showTimer:true,showGoal:true,showRules:true,showFoot:true,showTicker:true,showDeco:true,bg:'gta'};
const KEY='gta6dash.v1';
let liveStart=null;
let S={...DEF};
try{const r=localStorage.getItem(KEY);if(r)S={...DEF,...JSON.parse(r)}}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const show=(el,on,d='block')=>$(el).style.display=on?d:'none';

// ===== Escala do palco para caber na tela =====
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);$('stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

// ===== Aplicar configurações na tela =====
function render(){
  const T=THEMES[S.theme]||THEMES.vice,r=document.documentElement.style;
  r.setProperty('--g1',T.g1);r.setProperty('--g2',T.g2);r.setProperty('--g3',T.g3);
  r.setProperty('--c1',S.c1);r.setProperty('--c2',S.c2);
  $('stage').classList.toggle('photo',S.bg==='sunset');$('stage').classList.toggle('photo2',S.bg==='gta');$('title').textContent=S.title;$('sub').textContent=S.sub;
  show('title',S.showTitle);show('sub',S.showTitle);show('badge',S.showBadge,'inline-block');
  show('wClock',S.showClock);show('wTimer',S.showTimer);show('wGoal',S.showGoal);show('wRules',S.showRules);
  show('foot',S.showFoot);show('ticker',S.showTicker,'flex');
  ['sun','palmL','palmR'].forEach(i=>show(i,S.showDeco));
  $('foot').innerHTML=`<b>TikTok</b> ${esc(S.tiktok)} &nbsp;|&nbsp; <b>Canal</b> ${esc(String(S.twitchName).replace(/^.*twitch\.tv\//i,''))}`;
  const items=S.ticker.split('|').map(s=>s.trim()).filter(Boolean).join('   ★   ');
  $('tk').textContent=items+'   ★   ';
  $('rulesT').textContent=S.rules;
  $('goalL').textContent=S.goalLabel;
  show('info',false);
  const cur=S.goalCur;
  $('goalN').textContent=`${cur}/${S.goalMax}`;
  $('goalB').style.width=Math.max(0,Math.min(100,(cur/Math.max(1,S.goalMax))*100))+'%';
  const w=+S.psize,h=Math.round(w*9/16),b=$('playerBox');
  b.style.width=w+'px';b.style.height=h+'px';b.style.top=S.py+'px';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ===== Ligar campos do painel às configurações =====
function syncInputs(){
  document.querySelectorAll('[data-k]').forEach(el=>{const v=S[el.dataset.k];el.type==='checkbox'?el.checked=!!v:el.value=v});
  $('theme').value=S.theme;$('chIn').value=S.channel;
}
document.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{
  const k=el.dataset.k;
  S[k]=el.type==='checkbox'?el.checked:(el.type==='range'||el.type==='number')?Number(el.value):el.value;
  save();render();
}));
$('theme').addEventListener('change',e=>{S.theme=e.target.value;const T=THEMES[S.theme];S.c1=T.c1;S.c2=T.c2;save();syncInputs();render()});

// ===== Player da Twitch =====
function parseChannel(v){
  v=(v||'').trim();const m=v.match(/twitch\.tv\/([A-Za-z0-9_]+)/i);
  const n=m?m[1]:v.replace(/^@/,'');return /^[A-Za-z0-9_]{3,25}$/.test(n)?n.toLowerCase():'';
}
function loadPlayer(){
  const box=$('playerBox');
  box.querySelectorAll('iframe').forEach(f=>f.remove());
  if(!S.channel){$('ph').style.display='flex';return}
  $('ph').style.display='none';
  const host=location.hostname||'localhost';
  const f=document.createElement('iframe');
  f.src=`https://player.twitch.tv/?channel=${encodeURIComponent(S.channel)}&parent=${encodeURIComponent(host)}&autoplay=true&muted=false`;
  f.allow='autoplay; fullscreen';f.setAttribute('allowfullscreen','');
  box.appendChild(f);
}
$('load').addEventListener('click',()=>{
  const n=parseChannel($('chIn').value);
  if(!n){$('msg').textContent='Não consegui entender o canal. Cole o link (twitch.tv/nome) ou só o nome.';return}
  S.channel=n;S.twitchName=n;if(S.sub===DEF.sub)S.sub=n;save();syncInputs();render();loadPlayer();
  $('msg').textContent='Canal "'+n+'" carregado. Se o player ficar preto, a Twitch pode estar recusando o domínio desta página (parent: '+(location.hostname||'vazio')+'). Nesse caso, baixe o arquivo e hospede em outro lugar.';
});

// ===== Relógio e cronômetro =====
const t0=Date.now();let off=0;
const p2=n=>String(n).padStart(2,'0');
setInterval(()=>{
  const d=new Date();$('clk').textContent=p2(d.getHours())+':'+p2(d.getMinutes());
  const s=Math.floor((Date.now()-(liveStart||(t0+off)))/1000);$('tmr').textContent=p2(Math.floor(s/3600))+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60);
},1000);
$('rstT').addEventListener('click',()=>{off=Date.now()-t0});

// ===== Painel, modo gravação, tela cheia, wake lock =====
$('gear').addEventListener('click',()=>$('panel').classList.toggle('open'));
let wl=null;
async function keepAwake(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.body.classList.contains('rec')&&document.visibilityState==='visible')keepAwake()});
async function recOn(){
  $('panel').classList.remove('open');document.body.classList.add('rec');
  try{await document.documentElement.requestFullscreen()}catch(e){}
  keepAwake();
}
function recOff(){
  document.body.classList.remove('rec');
  try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
  try{wl&&wl.release()}catch(e){}
}
$('rec').addEventListener('click',recOn);
$('exit').addEventListener('dblclick',recOff);   // toque duplo no canto superior esquerdo
addEventListener('keydown',e=>{if(e.key==='Escape')recOff()});

// ===== Backup e reset =====
$('exp').addEventListener('click',()=>{$('bk').value=JSON.stringify(S)});
$('imp').addEventListener('click',()=>{
  try{S={...DEF,...JSON.parse($('bk').value)};save();syncInputs();render();loadPlayer()}catch(e){$('msg').textContent='JSON inválido.'}
});
$('reset').addEventListener('click',()=>{S={...DEF};save();syncInputs();render();loadPlayer()});

// O player oficial da Twitch funciona só com o nome do canal e o parent do domínio; não exige Client ID.

syncInputs();render();loadPlayer();
</script>
